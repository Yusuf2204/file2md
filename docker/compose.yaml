name: file2md  

services:
  file2md:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: file2md-app
    restart: unless-stopped
    ports:
      - "${PORT:-8031}:8000"
    volumes:
      - ../app:/app/app:ro
      - ../data:/app/data
      - hf-cache:/home/appuser/.cache/huggingface
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      - PYTHONUNBUFFERED=1

volumes:
  hf-cache: